<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Studio | Boot Sequence</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --text-main: #a9b7c6;
            --text-highlight: #cc7832;
            --text-string: #6a8759;
            --text-info: #6897bb;
            --text-error: #ff6b68;
            --text-success: #629755;
            --font-family: 'Consolas', 'Courier New', monospace;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 14px;
            padding: 15px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #terminal {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .line {
            margin: 2px 0;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .ascii-art {
            color: var(--text-success);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .log-timestamp { color: var(--text-info); margin-right: 10px; }
        .log-level { color: var(--text-highlight); margin-right: 10px; font-weight: bold; }
        .log-thread { color: var(--text-main); margin-right: 10px; }
        .log-class { color: var(--text-info); margin-right: 10px; }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .prompt { margin-right: 10px; color: var(--text-highlight); font-weight: bold; }

        input {
            background: transparent;
            border: none;
            color: var(--text-success);
            font-family: var(--font-family);
            font-size: 14px;
            outline: none;
            flex-grow: 1;
            padding: 0;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        /* Blinking cursor for the loader */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        footer {
            margin-top: 40px;
            border-top: 1px dashed #555;
            padding-top: 10px;
            color: #777;
        }

        footer a {
            color: var(--text-info);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div id="boot-sequence"></div>
        
        <div id="login-container" class="input-line hidden">
            <span class="prompt">Enter Username:</span>
            <input type="text" id="username" autocomplete="off" spellcheck="false">
        </div>

        <div id="password-container" class="input-line hidden">
            <span class="prompt">Enter Secret Key:</span>
            <input type="password" id="password" autocomplete="off">
        </div>

        <div id="auth-loader" class="line hidden"></div>

        <footer>
            <span class="log-timestamp" id="footer-time"></span>  INFO --- [  main] c.m.s.SystemFooter : System built and maintained by <a href="https://www.linkedin.com/in/er-abhinav-pandey/" target="_blank">@Abhinav Pandey</a>
        </footer>
    </div>

    <script>
        const bootSequenceDiv = document.getElementById('boot-sequence');
        const loginContainer = document.getElementById('login-container');
        const passwordContainer = document.getElementById('password-container');
        const authLoader = document.getElementById('auth-loader');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        let currentUsername = '';
        function getLogTime() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
        }

        setInterval(() => {
            document.getElementById('footer-time').innerText = getLogTime();
        }, 100);

        const asciiBanner = `
:::'###::::'########::'####::::'########::'#######::'########:::'######:::'########:
::'## ##::: ##.... ##:. ##::::: ##.....::'##.... ##: ##.... ##:'##... ##:: ##.....::
:'##:. ##:: ##:::: ##:: ##::::: ##::::::: ##:::: ##: ##:::: ##: ##:::..::: ##:::::::
'##:::. ##: ########::: ##::::: ######::: ##:::: ##: ########:: ##::'####: ######:::
 #########: ##.....:::: ##::::: ##...:::: ##:::: ##: ##.. ##::: ##::: ##:: ##...::::
 ##.... ##: ##::::::::: ##::::: ##::::::: ##:::: ##: ##::. ##:: ##::: ##:: ##:::::::
 ##:::: ##: ##::::::::'####:::: ##:::::::. #######:: ##:::. ##:. ######::: ########:
..:::::..::..:::::::::....:::::..:::::::::.......:::..:::::..:::......::::........::
`;

        const bootLogs = [
            "Initializing API Simulation Environment v1.0...",
            "[Core] -> Mounting In-Memory State Machine for scenario tracking",
            "[Network] -> Dynamic Spring Boot Proxy Controller Active",
            "[Engine] -> Embedded WireMock Engine linked to port 8089",
            "[System] -> Environment ready for simulated payloads.",
            "WARNING: Trying to access dashboard. Credentials required."
        ];

        function createLogLine(msg) {
            return `<span class="log-timestamp">${getLogTime()}</span>  <span class="log-level">INFO</span> <span class="log-thread">--- [           main]</span> <span class="log-class">project.mockservice.Application</span>    : ${msg}`;
        }

        async function runBootSequence() {
            const bannerDiv = document.createElement('div');
            bannerDiv.className = 'line ascii-art';
            bannerDiv.textContent = asciiBanner;
            bootSequenceDiv.appendChild(bannerDiv);


            for (let i = 0; i < bootLogs.length; i++) {
                await new Promise(r => setTimeout(r, Math.random() * 150 + 50)); // Random delay between 50-200ms
                
                const line = document.createElement('div');
                line.className = 'line';
                if(i === bootLogs.length - 1) {
                    line.innerHTML = `<span class="log-timestamp">${getLogTime()}</span>  <span class="log-level" style="color:var(--text-error)">WARN</span> <span class="log-thread">--- [  nio-8080-exec-1]</span> <span class="log-class">p.m.security.AuthInterceptor</span>   : <span style="color:var(--text-error)">${bootLogs[i]}</span>`;
                } else {
                    line.innerHTML = createLogLine(bootLogs[i]);
                }
                bootSequenceDiv.appendChild(line);
                window.scrollTo(0, document.body.scrollHeight);
            }
            setTimeout(() => {
                loginContainer.classList.remove('hidden');
                usernameInput.focus();
            }, 500);
        }
        document.addEventListener('click', () => {
            if (!loginContainer.classList.contains('hidden')) usernameInput.focus();
            if (!passwordContainer.classList.contains('hidden')) passwordInput.focus();
        });

        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                currentUsername = this.value.trim();
                this.disabled = true;
                
                loginContainer.classList.add('hidden');
                const logDiv = document.createElement('div');
                logDiv.className = 'line';
                logDiv.innerHTML = createLogLine(`Authenticating principal: ${currentUsername}`);
                bootSequenceDiv.appendChild(logDiv);

                passwordContainer.classList.remove('hidden');
                passwordInput.focus();
            }
        });
        // Handle Password Enter and API Call
        passwordInput.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                const password = this.value;
                this.disabled = true;
                passwordContainer.classList.add('hidden');

                // 1. Show the loader
                authLoader.classList.remove('hidden');
                authLoader.innerHTML = `<span class="log-timestamp">${getLogTime()}</span>  <span class="log-level">INFO</span> <span class="log-thread">--- [  nio-8080-exec-2]</span> <span class="log-class">p.m.security.AuthenticationManager</span> : Verifying credentials <span class="cursor-blink">...</span>`;
                window.scrollTo(0, document.body.scrollHeight);

                try {
                    const response = await fetch('/mock-studio/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: currentUsername, secretCode: password })
                    });

                    const data = await response.json();

                    // 2. Hide loader before showing result
                    authLoader.classList.add('hidden');

                    if (response.ok) {
                        // 3. Append SUCCESS permanently to the terminal
                        const successDiv = document.createElement('div');
                        successDiv.className = 'line';
                        successDiv.innerHTML = `<span class="log-timestamp">${getLogTime()}</span>  <span class="log-level" style="color:var(--text-success)">INFO</span> <span class="log-thread">--- [  nio-8080-exec-2]</span> <span class="log-class">p.m.security.AuthenticationManager</span> : <span style="color:var(--text-success)">Access Granted. 200 OK. Redirecting to dashboard...</span>`;
                        bootSequenceDiv.appendChild(successDiv);

                        sessionStorage.setItem('mockStudioAuth', 'granted');

                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1200);
                    } else {
                        throw new Error(data.message || "Authentication Failed");
                    }
                } catch (err) {
                    // 2. Hide loader before showing result
                    authLoader.classList.add('hidden');

                    // 3. Append ERROR permanently to the terminal
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'line';
                    errorDiv.innerHTML = `<span class="log-timestamp">${getLogTime()}</span>  <span class="log-level" style="color:var(--text-error)">ERROR</span> <span class="log-thread">--- [  nio-8080-exec-2]</span> <span class="log-class">p.m.security.AuthenticationManager</span> : <span style="color:var(--text-error)">401 UNAUTHORIZED - ${err.message}. Connection Reset.</span>`;
                    bootSequenceDiv.appendChild(errorDiv);
                    window.scrollTo(0, document.body.scrollHeight);

                    // 4. Reset the inputs for another attempt
                    setTimeout(() => {
                        usernameInput.disabled = false;
                        passwordInput.disabled = false;
                        usernameInput.value = '';
                        passwordInput.value = '';
                        loginContainer.classList.remove('hidden');
                        usernameInput.focus();
                    }, 1000);
                }
            }
        });
        window.onload = runBootSequence;
    </script>
</body>
</html>
